<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catálogo de tecidos</title>
<link rel="icon" type="image/png" href="ico.png">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css?v=20261013" />
</head>
<body>
<div id="catalogo-app">
  <div class="ct-shell">
    <header class="ct-topbar">
      <button type="button" class="ct-menu-btn" id="ct-menu-btn" aria-label="Abrir menu" aria-controls="ct-sidebar" aria-expanded="false"><span></span><span></span><span></span></button>
      <div class="ct-topbar-title"><span class="ct-brand-dot"></span>Catálogo de tecidos</div>
    </header>
    <div class="ct-backdrop" id="ct-backdrop"></div>
    <aside class="ct-sidebar" id="ct-sidebar">
      <div class="ct-brand"><span class="ct-brand-dot"></span>Catálogo de tecidos</div>
      <nav class="ct-nav" id="ct-nav"></nav>
      <div class="ct-sidebar-bottom" id="ct-authbar"></div>
    </aside>
    <main class="ct-content">
      <div id="ct-root"><div class="ct-loading">Carregando...</div></div>
    </main>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="script.js?v=20261013"></script>
<script>
// Menu mobile: abre/fecha a aba lateral como gaveta (no desktop não faz nada)
(function () {
  var btn = document.getElementById('ct-menu-btn');
  var backdrop = document.getElementById('ct-backdrop');
  var nav = document.getElementById('ct-nav');
  var authbar = document.getElementById('ct-authbar');
  var desktop = window.matchMedia('(min-width: 861px)');

  function setOpen(open) {
    document.body.classList.toggle('ct-menu-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
  }
  function isOpen() { return document.body.classList.contains('ct-menu-open'); }

  btn.addEventListener('click', function () { setOpen(!isOpen()); });
  backdrop.addEventListener('click', function () { setOpen(false); });

  // Escolheu uma aba (ou saiu da conta): fecha a gaveta
  nav.addEventListener('click', function (e) { if (e.target.closest('.ct-nav-item')) setOpen(false); });
  authbar.addEventListener('click', function (e) { if (e.target.closest('button, a')) setOpen(false); });

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });

  // Girou o aparelho / aumentou a janela até o modo desktop: garante que não fica "aberto"
  function onResize(ev) { if (ev.matches) setOpen(false); }
  if (desktop.addEventListener) desktop.addEventListener('change', onResize);
  else desktop.addListener(onResize);
})();
</script>
</body>
</html>
